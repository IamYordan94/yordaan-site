<style>
  html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }
  body { margin: 0; background: #080c20; color: #fff; font-family: "Archivo", "Helvetica Neue", Arial, sans-serif; }
  .wrap { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 32px; }

  h1 { font-family: "Permanent Marker", "Comic Sans MS", cursive; font-size: clamp(2.4rem, 7vw, 5rem); line-height: .9; margin: 24px 0 0; }
  p { color: #ffffffb3; max-width: 32rem; line-height: 1.6; }
  a.btn { display: inline-flex; align-items: center; gap: .6rem; margin-top: 32px; padding: 1.05rem 2.2rem; background: #bf3f57; color: #fff; text-decoration: none; font-size: .8rem; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; border: 2px solid transparent; }
  a.btn:hover { filter: brightness(1.08); transform: translateY(-2px); }
</style>
<script>
  /* tidy URLs: old confirmation links (/ticket/ALF-XXXXXX) now belong on the booking hub */
  (function () {
    var m = window.location.pathname.match(/\/ticket\/?([^\/]*)\/?$/);
    if (m) {
      var base = window.location.pathname.replace(/\/ticket\/?.*$/, "/");
      window.location.replace(base + "tickets.html");
    }
  })();
</script>
